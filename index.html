<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保险代理人智能工作台 V6.10</title>
<style>
:root {
  --blue: #1a56db; --blue-bg: #e8f0fe; --blue-dark: #1e3a5f;
  --green: #059669; --green-bg: #ecfdf5;
  --amber: #d97706; --amber-bg: #fffbeb;
  --pink: #db2777; --pink-bg: #fce7f3;
  --red: #dc2626; --red-bg: #fee2e2;
  --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
  --gray-300: #d1d5db; --gray-400:#9ca3af; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; color: var(--gray-900); line-height: 1.6;
}

/* Header */
.app-header {
  background: linear-gradient(135deg, #1e3a5f 0%, #1a56db 100%);
  color: #fff; padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-header h1 { font-size: 1.15rem; font-weight: 700; }
.app-header .badge { font-size: .72rem; background: rgba(255,255,255,.15); padding: 4px 12px; border-radius: 20px; }
.app-header .demo-note { font-size: .68rem; color: rgba(255,255,255,.6); margin-left: 10px; }

/* Tabs — priority ordered */
.tab-nav {
  display: flex; background: #fff; border-bottom: 1px solid var(--gray-200);
  padding: 0 16px; gap: 0; overflow-x: auto; position: sticky; top: 0; z-index: 50;
}
.tab-btn {
  padding: 13px 18px; border: none; background: none; cursor: pointer;
  font-size: .88rem; font-weight: 600; color: var(--gray-500);
  border-bottom: 3px solid transparent; white-space: nowrap; transition: all .15s;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--gray-900); }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-btn .ic { font-size: 1.05rem; }
.tab-btn .dot { background: var(--red); color:#fff; font-size:.62rem; font-weight:700; border-radius:10px; padding:1px 6px; margin-left:2px; }

.tab-content { display: none; padding: 20px 24px; max-width: 1240px; margin: 0 auto; }
.tab-content.active { display: block; }

/* Cards & panels */
.panel { background: #fff; border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.panel-header {
  padding: 14px 18px; border-bottom: 1px solid var(--gray-100);
  font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 16px 18px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.flex-row { display: flex; gap: 16px; align-items: flex-start; }
.flex-1 { flex: 1; }
.w-300 { width: 300px; flex-shrink: 0; }

/* Buttons */
.btn {
  padding: 8px 16px; border: 1px solid var(--gray-300); border-radius: 8px;
  background: #fff; cursor: pointer; font-size: .85rem; font-weight: 600; transition: all .15s;
}
.btn:hover { background: var(--gray-50); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #1648b8; }
.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-wa { background:#25d366; color:#fff; border-color:#25d366; }
.btn-disabled { background: var(--gray-100); color: var(--gray-500); border-color: var(--gray-200); cursor: default; }
.btn-block { width:100%; text-align:center; justify-content:center; }

/* Tags */
.tag { display: inline-block; font-size: .7rem; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.tag-blue { background: var(--blue-bg); color: var(--blue); }
.tag-green { background: var(--green-bg); color: var(--green); }
.tag-amber { background: var(--amber-bg); color: var(--amber); }
.tag-red { background: var(--red-bg); color: var(--red); }
.tag-gray { background: var(--gray-100); color: var(--gray-500); }
.tag-vip { background: linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }

/* ════════ HOME / TODAY ════════ */
.home-greeting {
  background: linear-gradient(135deg, #1e3a5f 0%, #1a56db 100%);
  color:#fff; border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px;
  box-shadow: 0 4px 14px rgba(26,86,219,.25);
}
.home-greeting .hg-date { font-size:.82rem; opacity:.85; }
.home-greeting .hg-hello { font-size:1.5rem; font-weight:700; margin:4px 0 6px; }
.home-greeting .hg-summary { font-size:.95rem; opacity:.95; }
.home-greeting .hg-summary b { background:rgba(255,255,255,.2); padding:1px 8px; border-radius:6px; }

.action-block { margin-bottom: 16px; }
.action-block-head {
  display:flex; align-items:center; gap:8px; font-weight:700; font-size:1rem; margin-bottom:10px;
}
.action-block-head .ab-count { font-size:.75rem; font-weight:700; padding:2px 9px; border-radius:12px; }
.ab-appt .ab-count { background:var(--blue-bg); color:var(--blue); }
.ab-renew .ab-count { background:var(--amber-bg); color:var(--amber); }
.ab-lead .ab-count { background:var(--green-bg); color:var(--green); }

.todo-tile {
  background:#fff; border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer; transition:all .15s;
  border-left:4px solid var(--gray-200); display:flex; align-items:center; gap:14px;
}
.todo-tile:hover { box-shadow:0 4px 12px rgba(0,0,0,.1); transform:translateY(-1px); }
.todo-tile.t-appt { border-left-color:var(--blue); }
.todo-tile.t-renew { border-left-color:var(--amber); }
.todo-tile.t-lead { border-left-color:var(--green); }
.todo-avatar {
  width:48px; height:48px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1.5rem;
  background:var(--blue-bg);
}
.todo-main { flex:1; min-width:0; }
.todo-main .tm-name { font-weight:700; font-size:.95rem; }
.todo-main .tm-sub { font-size:.8rem; color:var(--gray-500); margin-top:2px; }
.todo-main .tm-action { font-size:.78rem; color:var(--blue); margin-top:3px; font-weight:600; }
.todo-time { text-align:right; flex-shrink:0; }
.todo-time .tt-big { font-weight:700; font-size:1rem; }
.todo-time .tt-small { font-size:.72rem; color:var(--gray-500); }
.todo-cta { font-size:.75rem; color:var(--gray-400); margin-left:6px; }

/* ════════ PREP CARD (备课卡) ════════ */
.prep-wrap { max-width: 420px; margin: 0 auto; }
.prep-selector { margin-bottom:14px; }
.prep-card {
  background:#fff; border-radius:18px; overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.12); border:1px solid var(--gray-200);
}
.prep-hero {
  background: linear-gradient(135deg,#1e3a5f,#1a56db); color:#fff; padding:22px 20px 18px;
  text-align:center; position:relative;
}
.prep-avatar {
  width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center; font-size:2.4rem; margin:0 auto 10px;
  border:3px solid rgba(255,255,255,.35);
}
.prep-name { font-size:1.35rem; font-weight:700; }
.prep-meta { font-size:.82rem; opacity:.9; margin-top:3px; }
.prep-tags { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.prep-tags span { font-size:.7rem; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:12px; }
.prep-body { padding:18px 18px 10px; }
.prep-row { border-radius:12px; padding:13px 14px; margin-bottom:12px; }
.prep-row .pr-label { font-size:.72rem; font-weight:700; letter-spacing:.5px; margin-bottom:5px; display:flex; align-items:center; gap:5px; }
.prep-row .pr-text { font-size:.9rem; line-height:1.55; }
.pr-last { background:var(--gray-50); }
.pr-last .pr-label { color:var(--gray-500); }
.pr-focus { background:var(--blue-bg); }
.pr-focus .pr-label { color:var(--blue); }
.pr-open { background:var(--green-bg); }
.pr-open .pr-label { color:var(--green); }
.pr-open .pr-text { font-style:italic; }
.prep-risk {
  background:var(--amber-bg); border:1px solid #fcd34d; border-radius:12px; padding:12px 14px; margin-bottom:12px;
}
.prep-risk .pr-label { font-size:.72rem; font-weight:700; color:var(--amber); margin-bottom:4px; }
.prep-risk .pr-num { font-size:1.05rem; font-weight:700; color:var(--red); }
.prep-actions { display:flex; gap:8px; padding:6px 18px 18px; }
.prep-actions .btn { flex:1; padding:11px 6px; font-size:.82rem; }
.prep-foot { display:flex; gap:8px; padding:0 18px 18px; }
.prep-foot .btn { flex:1; font-size:.8rem; }

/* coverage mini bars */
.cov-dim { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.cov-dim-name { width: 56px; font-size: .8rem; font-weight: 600; }
.cov-dim-track { flex: 1; height: 8px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
.cov-dim-fill { height: 100%; border-radius: 4px; transition:width .5s; }
.cov-dim-val { width: 40px; font-size: .75rem; text-align: right; }

/* ════════ MEETING ASSIST (见面辅助) ════════ */
.obj-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.obj-card {
  border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; transition:all .15s;
}
.obj-card:hover { box-shadow:0 3px 10px rgba(0,0,0,.08); border-color:var(--blue); }
.obj-trigger {
  background:var(--gray-50); padding:10px 14px; font-weight:700; font-size:.85rem;
  display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--gray-100);
}
.obj-trigger .ot-q { color:var(--red); }
.obj-resp { padding:12px 14px; font-size:.84rem; color:var(--gray-700); line-height:1.6; }
.obj-resp .or-tip { display:block; margin-top:6px; font-size:.72rem; color:var(--blue); font-weight:600; }

.ai-speech-result {
  background: var(--blue-bg); padding: 12px; border-radius: 8px; font-size: .86rem; color: var(--gray-700);
  border-left: 3px solid var(--blue); margin-top: 8px; white-space:pre-wrap;
}
.ai-speech-box textarea { width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: .85rem; margin-bottom: 6px; }

.faq-item { border: 1px solid var(--gray-200); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.faq-q { font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
.faq-a { font-size: .82rem; color: var(--gray-700); }
.visit-item { background:var(--gray-50); border-left:3px solid var(--blue); border-radius:6px; padding:10px 12px; margin-bottom:8px; }

/* roleplay */
.roleplay-chat { max-height: 300px; overflow-y: auto; margin-bottom: 12px; padding:4px; }
.roleplay-msg { display: flex; gap: 8px; margin-bottom: 10px; }
.roleplay-msg.agent { justify-content: flex-end; }
.roleplay-msg .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: .85rem; }
.roleplay-msg.customer .msg-bubble { background: var(--gray-100); border-bottom-left-radius: 3px; }
.roleplay-msg.agent .msg-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 3px; }
.roleplay-msg .msg-label { font-size: .65rem; color: var(--gray-500); margin-bottom: 2px; }
.roleplay-msg.agent .msg-label { text-align: right; }
.coaching-box { background:#fef3c7; border:1px solid #fcd34d; border-radius:8px; padding:12px; font-size:.82rem; margin-bottom:12px; }

/* ════════ CLIENT FILE / PLAN ════════ */
.client-card {
  padding: 12px 14px; border: 1px solid var(--gray-200); border-radius: 10px;
  cursor: pointer; transition: all .15s; margin-bottom: 8px;
}
.client-card:hover { border-color: var(--blue); background: var(--blue-bg); }
.client-card.selected { border-color: var(--blue); background: var(--blue-bg); border-width: 2px; }
.client-card .name { font-weight: 700; font-size: .92rem; }
.client-card .meta { font-size: .78rem; color: var(--gray-500); margin-top: 3px; }
.client-card .tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.client-card .tags span { font-size: .68rem; padding: 2px 8px; border-radius: 10px; background: var(--gray-100); }
.health-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
.health-dot.green{background:var(--green);} .health-dot.yellow{background:var(--amber);} .health-dot.red{background:var(--red);}
.search-box { width:100%; padding:10px 14px; border:1px solid var(--gray-200); border-radius:8px; font-size:.9rem; margin-bottom:12px; }
.scroll-y { max-height: 320px; overflow-y: auto; }
/* 侧栏整列 sticky（align-self:flex-start 保持自然高度，containing block=高的 flex-row，故可全程跟随） */
.side-col { align-self: flex-start; position: -webkit-sticky; position: sticky; top: 60px; z-index: 5; }
.sticky-nav { /* 侧栏内导航面板，sticky 由 .side-col 整列负责 */ }
@media (max-width: 900px) { .side-col { position: static; } }

/* adequacy */
.adq-row { padding:12px 0; border-bottom:1px solid var(--gray-100); }
.adq-row:last-child { border-bottom:none; }
.adq-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
.adq-name { font-weight:700; font-size:.9rem; }
.adq-pct { font-size:.8rem; font-weight:700; }
.adq-track { height:9px; background:var(--gray-100); border-radius:5px; overflow:hidden; }
.adq-fill { height:100%; border-radius:5px; transition:width .6s; }
.adq-nums { font-size:.78rem; color:var(--gray-500); margin-top:5px; }
.adq-nums b { color:var(--gray-900); }
.adq-loss { font-size:.78rem; color:var(--red); margin-top:3px; }

/* rec card */
.rec-card { border:1px solid var(--gray-200); border-radius:12px; padding:15px; margin-bottom:12px; display:flex; gap:13px; align-items:flex-start; position:relative; }
.rec-score { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; flex-shrink:0; color:#fff; }
.rec-score.high { background:var(--green); } .rec-score.medium { background:var(--amber); }
.rec-body { flex:1; }
.rec-body .rec-name { font-weight:700; margin-bottom:4px; }
.rec-body .rec-summary { font-size:.85rem; color:var(--gray-700); margin-bottom:6px; }
.rec-loss { font-size:.8rem; color:var(--red); background:var(--red-bg); padding:6px 10px; border-radius:6px; margin:6px 0; }
.rec-peers { font-size:.78rem; color:var(--green); background:var(--green-bg); padding:6px 10px; border-radius:6px; margin:6px 0; }
.rec-pitch { font-size:.8rem; color:var(--gray-500); font-style:italic; border-left:3px solid var(--gray-200); padding-left:10px; }
.rec-badge { position:absolute; top:-1px; right:-1px; background:var(--green); color:#fff; font-size:.65rem; font-weight:600; padding:3px 10px; border-radius:0 12px 0 8px; }

.priority-box { background:var(--gray-50); border-radius:8px; padding:14px; border-left:4px solid var(--blue); margin-bottom:14px; }
.priority-box .p-item { font-size:.82rem; margin-bottom:5px; display:flex; align-items:center; gap:7px; }
.priority-box .p-num { width:18px; height:18px; border-radius:50%; background:var(--blue); color:#fff; font-size:.65rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

.compare-table { width:100%; font-size:.82rem; border-collapse:collapse; margin:10px 0; }
.compare-table th, .compare-table td { padding:8px 10px; border:1px solid var(--gray-200); }
.compare-table th { background:var(--gray-50); text-align:left; }
.proposal-edit { width:100%; min-height:220px; padding:12px; border:1px solid var(--gray-200); border-radius:8px; font-family:inherit; font-size:.85rem; line-height:1.7; }

/* view toggle */
.view-toggle { display:inline-flex; background:var(--gray-100); border-radius:8px; padding:3px; gap:2px; }
.view-toggle button { border:none; background:none; padding:6px 16px; border-radius:6px; font-size:.82rem; font-weight:600; cursor:pointer; color:var(--gray-500); }
.view-toggle button.active { background:#fff; color:var(--blue); box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* CLIENT-FACING VIEW */
.cv-wrap { background:linear-gradient(160deg,#f8fafc,#eef2ff); border-radius:16px; padding:26px; }
.cv-title { text-align:center; margin-bottom:18px; }
.cv-title h2 { font-size:1.5rem; color:var(--blue-dark); }
.cv-title p { color:var(--gray-500); font-size:.9rem; margin-top:4px; }
.cv-gap { background:#fff; border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.cv-gap h3 { font-size:1.05rem; margin-bottom:14px; color:var(--gray-900); }
.cv-bigbar { margin-bottom:14px; }
.cv-bigbar .cb-top { display:flex; justify-content:space-between; font-size:.95rem; font-weight:700; margin-bottom:6px; }
.cv-bigbar .cb-track { height:16px; background:var(--gray-100); border-radius:8px; overflow:hidden; }
.cv-bigbar .cb-fill { height:100%; border-radius:8px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; color:#fff; font-size:.7rem; font-weight:700; }
.cv-prod { background:#fff; border-radius:14px; padding:0; margin-bottom:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.cv-prod-head { background:var(--blue); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
.cv-prod-head .cph-name { font-size:1.1rem; font-weight:700; }
.cv-prod-head .cph-cat { font-size:.75rem; background:rgba(255,255,255,.22); padding:3px 10px; border-radius:12px; }
.cv-prod-body { padding:16px 18px; }
.cv-spec { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.cv-spec .cs-cell { text-align:center; background:var(--gray-50); border-radius:10px; padding:12px; }
.cv-spec .cs-val { font-size:1.35rem; font-weight:700; color:var(--blue-dark); }
.cv-spec .cs-lbl { font-size:.75rem; color:var(--gray-500); margin-top:3px; }
.cv-highlight { background:var(--green-bg); border-radius:10px; padding:12px 14px; font-size:.9rem; color:#065f46; }
.cv-highlight b { color:var(--green); }
.cv-perday { text-align:center; font-size:.95rem; color:var(--gray-700); margin-top:10px; }
.cv-perday b { font-size:1.3rem; color:var(--amber); }

/* ════════ PERFORMANCE ════════ */
.metric-card { text-align: center; padding: 16px; }
.metric-card .value { font-size: 1.7rem; font-weight: 700; }
.metric-card .label { font-size: .8rem; color: var(--gray-500); margin-top: 4px; }
.kpi-row { display:flex; gap:12px; margin-bottom:12px; align-items:center; cursor:pointer; }
.kpi-label { width:90px; font-size:.85rem; font-weight:600; flex-shrink:0; }
.kpi-track { flex:1; height:24px; background:var(--gray-100); border-radius:12px; overflow:hidden; }
.kpi-fill { height:100%; border-radius:12px; display:flex; align-items:center; justify-content:flex-end; padding-right:10px; font-size:.75rem; color:#fff; font-weight:600; }
.kpi-val { width:110px; text-align:right; font-size:.82rem; flex-shrink:0; }
.pipeline-stage { background:var(--gray-50); border-radius:10px; padding:12px; min-height:120px; }
.pipeline-stage h4 { font-size:.8rem; color:var(--gray-500); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
.lead-card { background:#fff; border:1px solid var(--gray-200); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:.85rem; cursor:pointer; transition:all .15s; }
.lead-card:hover { border-color:var(--blue); box-shadow:0 2px 4px rgba(0,0,0,.06); }
.lead-card .lead-name { font-weight:700; }
.lead-card .lead-meta { font-size:.75rem; color:var(--gray-500); margin-top:2px; }
.renew-alert { background:var(--amber-bg); border:1px solid #fcd34d; border-radius:8px; padding:14px; font-size:.85rem; margin-bottom:16px; }
.ml-info { display:inline-block; width:15px; height:15px; border-radius:50%; background:var(--gray-300); color:#fff; font-size:.62rem; text-align:center; line-height:15px; cursor:help; position:relative; }
.ml-info:hover::after { content:attr(data-tip); position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gray-900); color:#fff; font-size:.72rem; padding:6px 10px; border-radius:6px; z-index:10; width:230px; text-align:left; line-height:1.4; }

/* underwriting */
.uw-policy-card { background:#fff; border:1px solid var(--gray-200); border-radius:12px; padding:18px; margin-bottom:14px; }
.uw-policy-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
.uw-policy-title { font-weight:700; font-size:.92rem; }
.uw-policy-subtitle { font-size:.78rem; color:var(--gray-500); margin-top:2px; }
.uw-policy-status { font-size:.72rem; padding:4px 12px; border-radius:12px; font-weight:600; }

// ─── 方案数据源（单一真相，跨页同步）─────────────────────────
function buildClientPlan(c) {
  const recs = computeRecommendations(c);
  state.plans[c.id] = { recs, activeProducts: recs.map((_, i) => i), proposal: '', proposalGenerated: false, proposalStale: false, checkedEvents: [] };
  return state.plans[c.id];
}
function ensureClientPlan(c) {
  if (!state.plans[c.id]) buildClientPlan(c);
  return state.plans[c.id];
}
// 把某客户的方案设为"当前活动方案"，所有全局状态都从该方案恢复（含建议书），避免串客户
function syncActivePlan(c) {
  const p = state.plans[c.id]; if (!p) return p;
  state.lastRecommendations = p.recs; state.lastClientForRec = c; state.activeProducts = p.activeProducts;
  state.lastProposal = p.proposal || ''; state.proposalGenerated = !!p.proposalGenerated; state.proposalStale = !!p.proposalStale;
  return p;
}
function persistPlan(c) {
  if (!c || !state.plans[c.id]) return;
  const p = state.plans[c.id];
  p.recs = state.lastRecommendations; p.activeProducts = state.activeProducts;
  p.proposal = state.lastProposal; p.proposalGenerated = state.proposalGenerated; p.proposalStale = state.proposalStale;
}
// 当前可见（未移除）的推荐
function planVisibleRecs(c) {
  const p = state.plans[c.id]; if (!p) return [];
  return (p.activeProducts || p.recs.map((_, i) => i)).map(i => p.recs[i]).filter(Boolean);
}
// 已"加入方案"的推荐；若一个都没加，回退到可见推荐（用于话术速查）
function planSelectedOrVisible(c) {
  const vis = planVisibleRecs(c);
  const sel = vis.filter(r => r.selected);
  return sel.length ? sel : vis;
}
// 仅"加入方案"的推荐 = 最终方案（用于建议书 / 话术 / 充足度投影）
function planAppliedRecs(c) { return planVisibleRecs(c).filter(r => r.selected); }
function planSelected(c) { return planAppliedRecs(c); }

const API_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
const API_KEY = 'df429b58f86a4280a5864a1594991126.pvNJ6ZG7OnPOoFuF';

async function callLLM(systemPrompt, userContent, maxTokens = 1024) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
    body: JSON.stringify({ model: 'glm-4-flash', messages: [ { role: 'system', content: systemPrompt }, { role: 'user', content: userContent } ], max_tokens: maxTokens, temperature: 0.7 })
  });
  if (!resp.ok) throw new Error('LLM API error ' + resp.status);
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || '';
}

async function callLLMStream(systemPrompt, userContent, onToken, maxTokens = 1024) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
    body: JSON.stringify({ model: 'glm-4-flash', messages: [ { role: 'system', content: systemPrompt }, { role: 'user', content: userContent } ], max_tokens: maxTokens, temperature: 0.7, stream: true })
  });
  if (!resp.ok) throw new Error('LLM API error ' + resp.status);
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || !trimmed.startsWith('data: ')) continue;
      const data = trimmed.slice(6);
      if (data === '[DONE]') return;
      try { const json = JSON.parse(data); const token = json.choices?.[0]?.delta?.content || ''; if (token) onToken(token); } catch (e) {}
    }
  }
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  state.activeTab = tabId;
  if (tabId === 'home') renderHome();
  if (tabId === 'prep') renderPrep();
  if (tabId === 'meeting') renderMeeting();

function parseMoney(s) {
  if (!s) return 0;
  const m = String(s).match(/RM\s*([\d,\.]+)\s*([KkMm]?)/);
  if (!m) { const n = String(s).replace(/[^0-9]/g, ''); return n ? parseInt(n) : 0; }
  let v = parseFloat(m[1].replace(/,/g, ''));
  if (/k/i.test(m[2])) v *= 1000;
  if (/m/i.test(m[2])) v *= 1000000;
  return Math.round(v);
}
function clientIncome(c) {
  const nums = (c.financial.incomeRange.match(/[\d,]+/g) || []).map(n => parseInt(n.replace(/,/g, '')));
  if (nums.length >= 2) return Math.round((nums[0] + nums[1]) / 2);
  return nums[0] || 4000;
}
function clientMortgage(c) {
  const l = (c.financial.liabilities || []).find(x => x.includes('房贷'));
  return l ? parseMoney(l) : 0;
}
function childCount(c) {
  const m = c.dependents.match(/(\d+)\s*child/);
  if (m) return parseInt(m[1]);
  return /child/.test(c.dependents) ? 1 : 0;
}
function daysUntil(dateStr) {
  if (!dateStr) return 9999;
  return Math.ceil((new Date(dateStr) - TODAY) / (1000 * 60 * 60 * 24));
}
function fmtRM(n) { return 'RM ' + Math.round(n).toLocaleString(); }

// 保障充足度 — "够不够"，不只是"有没有"
// 马来西亚私立医院日均 RM 1,500-3,000；重疾建议保额 = 年收入×3-5倍；
// 寿险 = 房贷余额 + 10年生活费 + 子女教育金
// 把一条推荐换算成它能补到的保额（用于充足度规划投影）
function recCoverAmount(r) {
  if (typeof r.coverAmount === 'number') return r.coverAmount; // 跟随用户调整的保额
  return parseMoney(r.suggestedSumAssured);
}
// computeAdequacy(c, projRecs)：projRecs 为"已加入方案"的推荐，用于计算规划后的投影充足度
function computeAdequacy(c, projRecs) {
  projRecs = projRecs || [];
  const income = clientIncome(c);
  const annual = income * 12;
  const rows = [];
  const sumBy = (pred) => projRecs.filter(pred).reduce((s, r) => s + recCoverAmount(r), 0);

  // 寿险
  const lifeCov = c.coverageDetails.find(d => d.type === '寿险');
  const lifeNow = lifeCov ? parseMoney(lifeCov.coverage) : 0;
  const mortgage = clientMortgage(c);
  const livingNeed = Math.round(income * 0.6 * 12 * 10);
  const eduNeed = childCount(c) * 120000;
  const lifeNeed = mortgage + livingNeed + eduNeed;
  const lifeProj = lifeNow + sumBy(r => r.category === 'life');
  rows.push({
    key: 'life', name: '寿险（身故保障）', icon: '🛡️', now: lifeNow, need: lifeNeed, proj: lifeProj,
    pct: lifeNeed ? Math.min(100, Math.round(lifeNow / lifeNeed * 100)) : 100,
    projPct: lifeNeed ? Math.min(100, Math.round(lifeProj / lifeNeed * 100)) : 100,
    breakdown: `房贷 ${fmtRM(mortgage)} + 10年生活费 ${fmtRM(livingNeed)} + 子女教育 ${fmtRM(eduNeed)}`,
    loss: lifeNow < lifeNeed ? `若家庭支柱不幸离世，家人将面临约 ${fmtRM(lifeNeed - lifeNow)} 的资金缺口` : '保障充足'
  });

  // 重疾
  const ciCov = c.coverageDetails.find(d => d.type.includes('重疾'));
  const ciNow = ciCov ? parseMoney(ciCov.coverage) : 0;
  const ciNeed = annual * 4;
  const ciProj = ciNow + sumBy(r => r.category === 'health' && (r.productId || '').includes('CI'));
  rows.push({
    key: 'critical', name: '重疾（确诊即赔）', icon: '🏥', now: ciNow, need: ciNeed, proj: ciProj,
    pct: ciNeed ? Math.min(100, Math.round(ciNow / ciNeed * 100)) : 100,
    projPct: ciNeed ? Math.min(100, Math.round(ciProj / ciNeed * 100)) : 100,
    breakdown: `年收入 ${fmtRM(annual)} × 4 倍（覆盖治疗 + 3年收入中断）`,
    loss: ciNow < ciNeed ? `若确诊重疾，治疗+康复+收入中断预计损失约 ${fmtRM(ciNeed - ciNow)}` : '保障充足'
  });

  // 医疗
  const med = c.medicalPlan;
  const HOSP_DAY = 2000;
  let medPct = 0, medNow = '无', medNeed = `日额 ≥ ${fmtRM(HOSP_DAY)} / 年限额 ≥ RM 150,000`;
  if (med) {
    const dailyPct = Math.min(100, Math.round(med.dailyLimit / HOSP_DAY * 100));
    const annualPct = Math.min(100, Math.round(med.annualLimit / 150000 * 100));
    medPct = Math.round((dailyPct + annualPct) / 2);
    medNow = `日额 ${fmtRM(med.dailyLimit)} / 年限额 ${fmtRM(med.annualLimit)}`;
  }
  const medPlanned = projRecs.some(r => r.category === 'health' && (r.productId || '').includes('MED'));
  const medProj = medPlanned ? Math.max(medPct, 92) : medPct;
  rows.push({
    key: 'medical', name: '医疗（住院报销）', icon: '💊', pct: medPct, projPct: medProj,
    nowText: medNow + (medPlanned ? '（规划升级至 RM 150K 计划）' : ''), needText: medNeed,
    breakdown: `私立医院日均约 ${fmtRM(HOSP_DAY)}，重大手术年花费可达 RM 100K+`,
    loss: medPct < 70 ? (med ? `日额/年限额偏低，一次大病可能需自掏 RM 30,000-80,000 差额` : '无住院医疗保障，一次住院全部自费') : '保障充足',
    isText: true
  });

  // 财富积累（教育/养老）
  if (childCount(c) > 0 && c.age < 50) {
    const eduCov = c.coverageDetails.find(d => d.type.includes('储蓄') || d.type.includes('教育'));
    const eduNow = eduCov ? parseMoney(eduCov.coverage) : 0;
    const eduTarget = childCount(c) * 120000;
    const eduProj = eduNow + sumBy(isEduSavings);
    rows.push({
      key: 'savings', name: '教育金储备', icon: '🎓', now: eduNow, need: eduTarget, proj: eduProj,
      pct: eduTarget ? Math.min(100, Math.round(eduNow / eduTarget * 100)) : 100,
      projPct: eduTarget ? Math.min(100, Math.round(eduProj / eduTarget * 100)) : 100,
      breakdown: `${childCount(c)} 名子女 × 大学费用约 RM 120,000`,
      loss: eduNow < eduTarget ? `子女高等教育资金缺口约 ${fmtRM(eduTarget - eduNow)}` : '储备充足'
    });
  }
  if (c.age >= 45) {
    const savCov = c.coverageDetails.find(d => d.type.includes('储蓄'));
    const savNow = savCov ? parseMoney(savCov.coverage) : 0;
    const retireTarget = annual * 8;
    const savProj = savNow + sumBy(r => r.category === 'savings' && !isEduSavings(r));
    rows.push({
      key: 'pension', name: '退休/养老储备', icon: '🏖️', now: savNow, need: retireTarget, proj: savProj,
      pct: retireTarget ? Math.min(100, Math.round(savNow / retireTarget * 100)) : 100,
      projPct: retireTarget ? Math.min(100, Math.round(savProj / retireTarget * 100)) : 100,
      breakdown: `目标退休储备约 8 倍年收入 ${fmtRM(retireTarget)}`,
      loss: savNow < retireTarget ? `退休收入替代不足，缺口约 ${fmtRM(retireTarget - savNow)}` : '储备充足'
    });
  }
  return rows;
}
function adqColor(pct) { return pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--red)'; }

// ─── 规则引擎核心（保持不变）─────────────────────────────────
function computeGapAnalysis(c) {
  const gaps = [];
  const income = parseInt(c.financial.incomeRange.replace(/[^0-9]/g, '').slice(0,5)) || c.age * 100;
  const lifeCov = c.coverageDetails.find(d => d.type === '寿险');
  const lifeAmount = lifeCov ? parseInt(lifeCov.coverage.replace(/[^0-9]/g, '')) : 0;
  const ciCov = c.coverageDetails.find(d => d.type.includes('重疾'));
  const medCov = c.coverageDetails.find(d => d.type.includes('医疗'));
  const savCov = c.coverageDetails.find(d => d.type.includes('储蓄'));

  const lifeGap = (c.hasMortgage ? 450000 : 0) + (c.dependents.includes('child') ? 200000 : 0) - lifeAmount;
  if (lifeGap > 0 || lifeAmount === 0) {
    gaps.push({ dimension:'人身风险缺口', detail: lifeAmount === 0 ? '无寿险保障' : '寿险保额不足', risk:'家庭支柱身故将导致收入中断', suggestedCategory: 'life', gapPercent: Math.min(95, lifeAmount === 0 ? 95 : Math.round(lifeGap/500000*100)), severity: lifeAmount === 0 ? 'high' : 'medium' });
  }
  if (!ciCov && c.age > 25) {
    gaps.push({ dimension:'健康风险缺口', detail:'无重疾保障', risk:`重疾可能造成${(income*24).toLocaleString()}收入损失`, suggestedCategory:'health', gapPercent: 95, severity:'high' });
  }
  if (!medCov) {
    gaps.push({ dimension:'健康风险缺口', detail:'无住院医疗保障', risk:'意外或疾病住院无财务支持', suggestedCategory:'health', gapPercent: 80, severity:'high' });
  }
  if (c.dependents.includes('child') && !savCov) {
    gaps.push({ dimension:'财富积累缺口', detail:'有子女但无教育金储备', risk:'子女高等教育费用无保障', suggestedCategory:'savings', gapPercent: 70, severity:'medium' });
  }
  if (c.age > 45 && !savCov) {
    gaps.push({ dimension:'财富积累缺口', detail:'临近退休但无养老储备', risk:'退休后收入替代率不足', suggestedCategory:'savings', gapPercent: 85, severity:'high' });
  }
  if (!c.coverageDetails.find(d => d.type.includes('意外'))) {
    gaps.push({ dimension:'健康风险缺口', detail:'无意外保障', risk:'意外事故无收入替代', suggestedCategory:'accident', gapPercent: 45, severity:'low' });
  }
  return gaps;
}
function retrieveProducts(gapTypes, clientProfile) {
  return PRODUCT_KB
    .filter(p => gapTypes.includes(p.category))
    .filter(p => clientProfile.age >= p.minAge && clientProfile.age <= (p.maxAge || 99))
    .sort((a, b) => scoreProduct(b, clientProfile) - scoreProduct(a, clientProfile))
    .slice(0, 3);
}
function scoreProduct(p, client) {
  let s = 50;
  if (client.hasMortgage && p.category === 'life') s += 20;
  if (client.dependents.includes('child') && p.category === 'savings') s += 20;
  if (client.dependents.includes('child') && (p.tags || []).some(t => t.includes('教育金'))) s += 25;
  if ((client.lifeEvents || []).some(e => e.name.includes('升学') || e.name.includes('教育')) && (p.tags || []).some(t => t.includes('教育金'))) s += 30;
  if (client.age > 45 && p.category === 'savings') s += 15;
  if (client.occupation.includes('Business') && p.category === 'business') s += 25;
  return s;
}
function getEventCategories(eventName) {
  if (!eventName) return [];
  if (eventName.includes('子女') || eventName.includes('升学') || eventName.includes('教育') || eventName.includes('新生儿')) return ['savings', 'health'];
  if (eventName.includes('退休') || eventName.includes('养老')) return ['savings'];
  if (eventName.includes('房产') || eventName.includes('贷款') || eventName.includes('生意')) return ['life', 'business'];
  return [];
}

// 把一个产品构造成一条推荐（可带生命事件标记 eventTag）
function buildRec(c, p, gap, eventTag) {
  gap = gap || { dimension: '综合保障', detail: '补充保障', risk: '提升保障完整性', gapPercent: 50, severity: 'medium' };
  const pitch = buildPitch(c, gap, p);
  const sa = computeSuggestedSumAssured(c, p);
  return {
    productId: p.id, product: p.name, category: p.category, categoryLabel: p.categoryLabel,
    score: Math.min(98, 60 + scoreProduct(p, c)),
    summary: `${gap.detail} — ${gap.risk}`,
    talkTrack: pitch.talkTrack, clientMessage: pitch.clientMessage,
    riskLoss: computeRiskLoss(c, p), peers: computePeerChoice(c, p),
    premium: computePremium(p, sa), suggestedSumAssured: sa, coverAmount: coverAmountFor(p, sa),
    gap, selected: false, eventTag: eventTag || null
  };
}
// 初步推荐方案：始终按"保障充足度缺口"匹配（每个缺口维度取契合度最高 2 款，上限 5 个）。
// 生命事件不在这里掺合——它是后续由代理人勾选、再【追加】到本方案中的。
function computeRecommendations(c) {
  const gaps = computeGapAnalysis(c);
  const gapCategories = [...new Set(gaps.map(g => g.suggestedCategory))];
  const allProducts = []; const seenIds = new Set();
  gapCategories.forEach(cat => {
    PRODUCT_KB.filter(p => p.category === cat).filter(p => c.age >= p.minAge && c.age <= (p.maxAge || 99))
      .sort((a, b) => scoreProduct(b, c) - scoreProduct(a, c)).slice(0, 2)
      .forEach(p => { if (!seenIds.has(p.id)) { seenIds.add(p.id); allProducts.push(p); } });
  });
  const recs = allProducts.slice(0, 5).map(p => buildRec(c, p, gaps.find(g => g.suggestedCategory === p.category)));
  recs.sort((a, b) => b.score - a.score);
  return recs;
}

// 每类生命事件对应的【具体产品】（不是整个大类，避免退休事件冒出教育金这种不相干产品）
const EVENT_PRODUCTS = {
  '新生儿/子女出生': ['AIA-EDU-001', 'AIA-MED-001'],
  '结婚': ['AIA-LIFE-001', 'AIA-MED-001'],
  '购置房产/贷款': ['AIA-LIFE-001'],
  '子女升学/出国': ['AIA-EDU-002', 'AIA-EDU-001'],
  '父母年迈/重病': ['AIA-MED-001', 'AIA-CI-001'],
  '换工作/失去雇主保障': ['AIA-MED-001', 'AIA-CI-001'],
  '退休临近（55岁+）': ['AIA-ANN-001', 'AIA-MED-001'],
  '生意扩张/新增贷款': ['AIA-BIZ-001', 'AIA-LIFE-001']
};
// 代理人勾选生命事件后：把对应的具体产品【追加】进已有的初步推荐方案，并标记"生命事件推荐"
function addEventProducts(clientId) {
  const c = CLIENTS.find(x => x.id === clientId); if (!c) return;
  const checked = [...document.querySelectorAll('#lifeEventChecks input:checked')].map(i => i.value);
  if (!checked.length) { showToast('请先勾选至少一个生命事件'); return; }
  const plan = ensureClientPlan(c); syncActivePlan(c); // 没有初步方案则先生成，再追加
  plan.checkedEvents = [...new Set([...(plan.checkedEvents || []), ...checked])]; // 记住勾选，重渲染后不丢
  state.currentGaps = computeGapAnalysis(c);
  const gaps = state.currentGaps;
  let added = 0, tagged = 0;
  checked.forEach(ev => {
    (EVENT_PRODUCTS[ev] || []).forEach(pid => {
      const p = PRODUCT_KB.find(x => x.id === pid);
      if (!p || c.age < p.minAge || c.age > (p.maxAge || 99)) return;
      const existing = plan.recs.find(r => r.productId === pid);
      if (existing) { if (existing.eventTag !== ev) { existing.eventTag = ev; tagged++; } }
      else {
        const rec = buildRec(c, p, gaps.find(g => g.suggestedCategory === p.category), ev);
        plan.recs.push(rec);
        plan.activeProducts.push(plan.recs.length - 1);
        added++;
      }
    });
  });
  state.lastRecommendations = plan.recs; state.activeProducts = plan.activeProducts;
  markStale();
  renderDecisionZone(c, plan.recs, state.lastProposal); // 事件产品会被置顶展示
  refreshAdequacy(c);
  setTimeout(() => scrollToSection('secRec'), 150);
  const msg = added
    ? `已追加 ${added} 个生命事件产品到候选池顶部（🔔 标记）${tagged ? '，另有 ' + tagged + ' 个已在池中已标记' : ''}。请点"加入方案"纳入最终方案。`
    : (tagged ? `相关产品已在候选池中，已标 🔔 置顶（${tagged} 个）。请点"加入方案"纳入。` : '所勾选事件暂无新增产品。');
  showToast(msg);
}
function computeSuggestedSumAssured(c, p) {
  if (p.category === 'life') return c.hasMortgage ? 'RM 800,000' : 'RM 500,000';
  if (p.category === 'health') {
    if ((p.tags||[]).some(t=>t.includes('重疾'))) return 'RM 300,000';
    return 'RM 150,000/年限额';
  }
  if (p.category === 'savings') {
    // 储蓄/教育/年金的"保额"= 满期可领取的金额（覆盖目标），不是月缴；月缴在 premium 里
    if (p.maturityBenefit) return p.maturityBenefit;          // 教育金满期给付
    if (p.monthlyPayout) return p.monthlyPayout + '（月领年金）'; // 年金
    return 'RM 100,000';
  }
  if (p.category === 'accident') return 'RM 50,000';
  if (p.category === 'business') return 'RM 1,000,000';
  return '根据需求定制';
}
function computePremium(p, sa) {
  if (p.premiumMonthly) { if (typeof p.premiumMonthly === 'number') return 'RM ' + p.premiumMonthly + '/月'; return 'RM ' + p.premiumMonthly.middle + '/月起'; }
  if (p.premiumRate && sa && sa.includes('RM')) { const num = parseInt(sa.replace(/[^0-9]/g, '')); if (num) return 'RM ' + Math.round(num * p.premiumRate) + '/月'; }
  if (p.minPremium) return 'RM ' + p.minPremium + '/月起'; // 储蓄/教育金按起缴月缴
  if (p.category === 'business') return 'RM 800/月起'; // 企业主/关键人方案
  return '请咨询代理人';
}
// 一条推荐对其所属缺口维度的"贡献保额"（数值），用于充足度投影
function coverAmountFor(p, sa) {
  if (p && p.category === 'savings' && p.monthlyPayout) return parseMoney(p.monthlyPayout) * 12 * 20; // 年金按 20 年累计
  return parseMoney(sa);
}
// 储蓄类按"用途"归到教育金 / 退休缺口（按标签判断，而非靠产品ID字符串，否则 Wealth Builder 会漏算）
function isEduSavings(r) {
  const kb = PRODUCT_KB.find(p => p.id === r.productId);
  const tags = ((kb && kb.tags) || []).join();
  return r.category === 'savings' && (/教育/.test(tags) || (r.productId || '').includes('EDU'));
}
// "如果发生 X，你会损失 RM Y" 风险量化
function computeRiskLoss(c, p) {
  const income = clientIncome(c); const annual = income * 12;
  if (p.category === 'life') {
    const total = clientMortgage(c) + Math.round(income*0.6*12*10) + childCount(c)*120000;
    const now = parseMoney((c.coverageDetails.find(d=>d.type==='寿险')||{}).coverage);
    return `若家庭支柱不幸离世，家庭需 ${fmtRM(total)}（房贷+10年生活费+教育），目前仅 ${fmtRM(now)}，缺口约 ${fmtRM(Math.max(0,total-now))}。`;
  }
  if (p.category === 'health') {
    if ((p.tags||[]).some(t=>t.includes('重疾'))) return `若确诊癌症等重疾，马来西亚平均治疗费 RM 150,000-250,000，加上 2-3 年收入中断约 ${fmtRM(annual*2.5)}，目前零现金赔付。`;
    return `若住院 30 天，私立医院日均约 RM 2,000，预计花费约 RM 60,000，目前需大部分自费。`;
  }
  if (p.category === 'savings') {
    if ((p.tags||[]).some(t=>t.includes('教育金'))) return `${childCount(c)||1} 名子女大学学费预计约 ${fmtRM((childCount(c)||1)*120000)}，目前储备不足，临到用钱时只能动用积蓄或贷款。`;
    return `退休后若无年金，需自行从积蓄中每月支取约 ${fmtRM(income*0.6)}，约 ${Math.max(1,75-Math.max(60,c.age))} 年后积蓄承压。`;
  }
  if (p.category === 'accident') return `若因意外伤残无法工作，每月 ${fmtRM(income)} 收入即中断，意外险可一次性补偿 RM 50,000。`;
  if (p.category === 'business') return `若企业关键人出意外，生意贷款 ${fmtRM(parseMoney((c.financial.liabilities||[]).find(x=>x.includes('生意'))||''))} 与运营将无人承接。`;
  return '补足该缺口可显著提升家庭抗风险能力。';
}
// "同类客户的真实选择"
function computePeerChoice(c, p) {
  if (c.occupation.includes('Business')) return `和您情况相似的 45 岁企业主，通常配置 重疾 RM 300K + 医疗家庭计划 + 定期寿险 RM 800K。`;
  if (c.age >= 50) return `准退休的同龄客户，多数选择 退休年金（月领 RM 2,000）+ 终身医疗卡 组合。`;

function buildPitch(c, gap, product) {
  const income = parseInt(c.financial.incomeRange.replace(/[^0-9]/g, '').slice(0,5)) || 4000;

// 自然口吻的 WhatsApp 模板（代理人真实会发的样子）
function buildWhatsApp(c, product, cat) {
  const first = c.name.split(' ')[0];
  const sa = computeSuggestedSumAssured(c, product);
  const prem = computePremium(product, sa);
  const premNum = parseInt((prem.match(/\d[\d,]*/) || ['480'])[0].replace(/,/g, ''));
  const perDay = Math.max(1, Math.round(premNum / 30));
  const lines = {
    health: { hook: `上次聊到您对重疾保障有兴趣，我把方案整理好了 👇`, content: `RM 300K 重疾保障`, prem: `${prem} = 每天约 RM ${perDay}`, light: `确诊即赔付，不需要等报销 💪` },
    life: { hook: `上次聊到家里房贷和孩子，我帮您算了份保障方案 👇`, content: `${sa} 寿险保障`, prem: `${prem} = 每天约 RM ${perDay}`, light: `万一有事，房贷和孩子教育都有着落 🏠` },
    savings: { hook: `帮您把孩子的教育金方案做出来了 👇`, content: `每月小额存，目标 ${product.maturityBenefit || 'RM 80K-200K'}`, prem: `${prem}`, light: `越早开始越轻松，复利帮您赚 📈` },
    accident: { hook: `推荐您一个性价比超高的小保障 👇`, content: `RM 50K 意外保障`, prem: `${prem} = 每天不到 RM 1`, light: `加在主险上，几乎无感 ✅` },
    business: { hook: `考虑到您公司的扩张，帮您看了企业主保障 👇`, content: `关键人 / 业务延续保障`, prem: `按需定制`, light: `万一关键人有事，生意不断档 🏢` },
    default: { hook: `帮您看了一下保障，有个重要缺口想跟您说 👇`, content: product.name, prem: `${prem}`, light: `很适合您目前的情况 😊` }
  };
  const l = lines[cat] || lines.default;
  return `${first}! ${l.hook}\n[保障内容] ${l.content}\n[月保费] ${l.prem}\n[最大亮点] ${l.light}\n方便今天或明天找个时间详细聊聊吗？😊`;
}
function isProductMatchForEvent(rec, eventName) {
  if (!rec || !eventName) return false;
  const tags = rec.productId ? (PRODUCT_KB.find(p => p.id === rec.productId)?.tags || []) : [];
  if (eventName.includes('子女') || eventName.includes('升学') || eventName.includes('教育')) return tags.some(t => t.includes('教育金')) || rec.category === 'savings';
  if (eventName.includes('退休') || eventName.includes('养老')) return tags.some(t => t.includes('年金') || t.includes('退休')) || rec.category === 'savings';
  if (eventName.includes('新生儿') || eventName.includes('子女出生')) return rec.category === 'health' || rec.category === 'savings';
  if (eventName.includes('房产') || eventName.includes('贷款')) return rec.category === 'life' || tags.some(t => t.includes('房贷') || t.includes('寿险'));
  if (eventName.includes('生意')) return rec.category === 'business' || rec.category === 'life';
  return false;
}
function mdToHtml(md) {
  if (!md) return '';
  return md.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n- /g, '\n• ').replace(/\n/g, '<br>');
}

function getAIAction(c) {
  const d = daysUntil(c.renewalDate);
  if (d <= 30 && d > 0) return '保单' + d + '天内到期，建议本周联系续保';
  if (c.lifeEvents.length > 0) return '有触发生命事件，建议安排拜访';
  if (c.healthScore.lastContact > 30) return '已' + c.healthScore.lastContact + '天未联系，建议主动跟进';
  if (c.healthScore.upsellPotential > 80) return '加保潜力高，建议推荐重疾/医疗';
  return '客户状态正常，按计划跟进';
}

}
function selectClient(id) {
  if (state.lastClientForRec && state.lastClientForRec.id !== id) {
    state.lastRecommendations = null; state.lastProposal = ''; state.proposalGenerated = false;
    state.proposalStale = false; state.currentGaps = null; state.activeProducts = null; state.triggeredEvent = null;
  }
  state.selectedClientId = id;
  const c = CLIENTS.find(x => x.id === id);
  if (c && state.plans[id]) { syncActivePlan(c); state.currentGaps = computeGapAnalysis(c); } // 恢复已保存方案

  const seed = VISIT_HISTORY[c.id] || [];

  return runtime.concat(seed).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

async function runRecommendation() {
  const c = CLIENTS.find(x => x.id === state.selectedClientId);
  if (!c) { showToast('请先选择客户'); return; }
  buildClientPlan(c); // 初步推荐方案：纯按充足度缺口（生命事件通过下方勾选再追加）
  state.currentGaps = computeGapAnalysis(c);
  syncActivePlan(c);
  state.proposalGenerated = false; state.lastProposal = ''; state.proposalStale = false;
  if (state.activeTab !== 'client') switchTab('client');
  renderClientDeep();
  setTimeout(() => scrollToSection('secRec'), 200);
}

function renderDecisionZone(c, recs, proposal) {
  const zone = document.getElementById('decisionZone');
  if (!zone) return;
  recs = recs || [];
  const hasPlan = recs.length > 0;
  const income = clientIncome(c);

// 一条推荐对应的充足度维度 key
function recDimKey(r) {
  if (r.category === 'life') return 'life';

  if (r.category === 'savings') return isEduSavings(r) ? 'savings' : 'pension';
  return null;
}
// 同业对标数据（按维度），根据方案里的产品动态展示
const BENCHMARK_ROWS = {
  life: [ { dim: '定期寿险费率（每10万保额）', aia: '约 RM 8/月起', industry: 'RM 12-15/月' }, { dim: '保证可续保', aia: '是', industry: '部分' } ],
  critical: [ { dim: '重疾理赔速度', aia: '24小时', industry: '3-5个工作日' }, { dim: '覆盖重疾种类', aia: '36种', industry: '约30种' }, { dim: '确诊即赔（非报销）', aia: '是', industry: '部分' } ],
  medical: [ { dim: '医疗年度限额', aia: 'RM 150,000', industry: 'RM 80,000' }, { dim: '住院实报实销', aia: '是', industry: '多有日额上限' }, { dim: '无限次住院', aia: '是', industry: '否' } ],
  savings: [ { dim: '教育金保证回报', aia: '3.8%-4.0%', industry: '2.5%-3%' }, { dim: '满期领取灵活度', aia: '分期/一次性', industry: '多为固定' } ],
  pension: [ { dim: '年金保证+分红', aia: '有', industry: '多为纯保证、偏低' }, { dim: '月领灵活度', aia: '高', industry: '一般' } ],
  accident: [ { dim: '意外伤残赔付', aia: 'RM 50K 起', industry: '相近' } ],
  business: [ { dim: '关键人/业务延续保障', aia: '有专属方案', industry: '少见' } ]
};
const BENCHMARK_VITALITY = { dim: 'AIA Vitality 健康奖励', aia: '有（保费折扣+健康福利）', industry: '无' };
function benchmarkRowsFor(recs) {
  const dims = [...new Set((recs || []).map(recDimKey).filter(Boolean))];
  let rows = [];
  dims.forEach(k => (BENCHMARK_ROWS[k] || []).forEach(r => rows.push(r)));
  if (!rows.length) rows = [...BENCHMARK_ROWS.critical, ...BENCHMARK_ROWS.medical]; // 无产品时给通用对标
  rows.push(BENCHMARK_VITALITY);
  return rows;
}
function benchmarkPanelHTML(recs) {
  const sel = (recs || []).filter(r => r.selected);
  const base = sel.length ? sel : (recs || []);

// ─── 候选池：加入是可逆开关；删除只对手工添加的产品（与"加入"对等，池子不被破坏）──
function markStale() { if (state.proposalGenerated) state.proposalStale = true; else { state.proposalGenerated = false; state.lastProposal = ''; } }
function toggleSelect(idx) {
  if (!state.lastRecommendations) return;
  const r = state.lastRecommendations[idx]; if (!r) return;
  r.selected = !r.selected; markStale();
  persistPlan(state.lastClientForRec);
  renderDecisionZone(state.lastClientForRec, state.lastRecommendations, state.lastProposal);
  refreshAdequacy(state.lastClientForRec);
  showToast(r.selected ? '✅ 已加入最终方案（建议书/话术/充足度已联动）' : '已移出最终方案');
}
function adjustSumAssured(idx) {
  if (!state.lastRecommendations) return;
  const r = state.lastRecommendations[idx]; if (!r) return;
  const newVal = prompt('请输入新的保额（' + (r.category === 'savings' ? '满期可领取金额' : '保障额度') + '）：', r.suggestedSumAssured);
  if (!newVal) return;
  r.suggestedSumAssured = newVal;
  const numVal = parseInt(newVal.replace(/[^0-9]/g, ''));
  if (numVal) {
    r.coverAmount = numVal; // 关键：保额→贡献保额，充足度投影随之联动（含教育金/储蓄）
    // 保费仅对"保障型"按费率重算；储蓄/年金的保费不按保额×费率
    if (['life', 'health', 'accident', 'business'].includes(r.category)) {
      r.premium = 'RM ' + Math.round(numVal * 0.0015).toLocaleString() + '/月';
    }
  }
  const c = state.lastClientForRec;
  markStale();
  persistPlan(c);
  renderDecisionZone(c, state.lastRecommendations, state.lastProposal);
  refreshAdequacy(c);
  showToast(r.selected ? '保额已更新，最终方案与充足度已联动' : '保额已更新（点"加入方案"后联动充足度）');
}
// 仅删除手工添加的候选（AI 推荐与事件追加的不做破坏性删除，不加入即可）
function removeCustom(idx) {
  if (!state.lastRecommendations) return;
  const r = state.lastRecommendations[idx];
  if (!r || !(r.productId || '').startsWith('CUSTOM')) { showToast('只有手工添加的产品可删除；AI 推荐不加入即可'); return; }
  state.lastRecommendations.splice(idx, 1);
  state.activeProducts = state.lastRecommendations.map((_, i) => i);
  markStale();
  persistPlan(state.lastClientForRec);
  renderDecisionZone(state.lastClientForRec, state.lastRecommendations, state.lastProposal);
  refreshAdequacy(state.lastClientForRec);
  showToast('已删除手工添加的产品');
}
function addCustomProduct() {
  const name = prompt('请输入产品名称：'); if (!name) return;
  const category = prompt('类别（life/health/savings/accident/business）：', 'health') || 'health';
  const premium = prompt('月保费（如：RM 350/月）：', 'RM 350/月') || '请咨询';
  const customRec = {
    productId: 'CUSTOM-' + Date.now().toString(36).toUpperCase(), product: name, category,
    categoryLabel: { life:'寿险', health:'健康险', savings:'储蓄险', accident:'意外险', business:'企业险' }[category] || '其他',
    score: 70, summary: '手工添加的产品', talkTrack: name + ' 可以为您提供针对性保障。', clientMessage: 'Hi，推荐您了解一下 ' + name + '。',
    riskLoss: '补足该缺口可提升家庭抗风险能力。', peers: '相似客户也会按需补充此类保障。',
    premium, suggestedSumAssured: '根据需求定制', gap: { dimension:'补充保障', detail:'手工添加', risk:'提升完整性', gapPercent:60, severity:'medium' }, selected: false
  };
  state.lastRecommendations.push(customRec);
  if (state.activeProducts) state.activeProducts.push(state.lastRecommendations.length - 1);
  else state.activeProducts = state.lastRecommendations.map((_, i) => i);
  markStale();
  persistPlan(state.lastClientForRec);
  renderDecisionZone(state.lastClientForRec, state.lastRecommendations, state.lastProposal);
  showToast('已添加到候选池：' + name + '（点"加入方案"纳入最终方案）');
}

// ─── SSE 流式建议书生成（带进度提示 + 打字机 + 完成闪烁）──────
async function generateProposal() {
  const c = state.lastClientForRec; const recs = state.lastRecommendations;
  if (!c || !recs) { showToast('请先生成推荐方案'); return; }
  if (!recs.some(r => r.selected)) { showToast('请先在候选池点"加入方案"选择至少一个产品，再生成建议书'); return; }
  const body = document.getElementById('proposalBody');
  body.innerHTML = `
    <div class="gen-steps">
      <div class="gen-step active" id="gs-1"><span class="gs-ic">①</span> 正在分析客户画像...</div>
      <div class="gen-step" id="gs-2"><span class="gs-ic">②</span> 正在匹配产品方案...</div>
      <div class="gen-step" id="gs-3"><span class="gs-ic">③</span> 正在生成建议书...</div>
    </div>
    <div class="stream-area typing" id="proposalStream"></div>`;
  const streamEl = document.getElementById('proposalStream');
  streamEl.classList.add('cursor-blink');
  const setStep = (n) => {
    for (let i = 1; i <= 3; i++) { const el = document.getElementById('gs-' + i); if (!el) continue; el.classList.toggle('done', i < n); el.classList.toggle('active', i === n); }
  };
  await new Promise(r => setTimeout(r, 500)); setStep(2);
  await new Promise(r => setTimeout(r, 500)); setStep(3);

  const gaps = state.currentGaps || computeGapAnalysis(c);
  const selectedRecs = recs.filter(r => r.selected); // 最终方案 = 已"加入"的产品

    const systemPrompt = `你是一位专业的AIA保险代理人，擅长为客户撰写个性化保险配置建议书。要求：
1. 专业但易懂的语言；2. 结合客户具体画像与保障缺口；3. 突出AIA产品与服务优势；

财务概况：${c.assetInfo}

【当前已有保障】
${c.coverageDetails.map(v => '- ' + v.type + '：' + v.coverage + '（' + v.insurer + '，到期' + v.expiryDate + '）').join('\n') || '暂无'}

【保障充足度缺口】
${computeAdequacy(c).map(r => '- ' + r.name + '：充足度' + r.pct + '%，' + r.loss).join('\n')}

【推荐方案】
${selectedRecs.map(r => '- ' + r.product + '（' + r.categoryLabel + '），月保费' + r.premium + '，保额' + r.suggestedSumAssured + '，' + r.riskLoss).join('\n')}

${evTags.length ? '【生命事件关注】客户已勾选：' + evTags.join('、') + '，请在建议书中针对性强调相关保障。' : ''}`;
    await callLLMStream(systemPrompt, userContent, (token) => {
      proposal += token;
      streamEl.classList.remove('cursor-blink');
      streamEl.textContent = proposal;
      streamEl.scrollTop = streamEl.scrollHeight;
    }, 2048);
    proposal = proposal.replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s+/gm, '').trim();
  } catch (e) {
    console.warn('Proposal LLM failed, fallback:', e);
    proposal = generateProposalFallback(c, selectedRecs);
    streamEl.textContent = proposal;
  }
  streamEl.classList.remove('cursor-blink', 'typing');
  streamEl.classList.add('done-flash');
  state.lastProposal = proposal; state.proposalGenerated = true; state.proposalStale = false;
  persistPlan(c); // 建议书写入该客户方案，切客户不丢、不串
  showToast('✅ 建议书生成完成');
  setTimeout(() => renderDecisionZone(c, recs, proposal), 950);
}
function generateProposalFallback(c, recs) {
  const evTags = [...new Set((recs || []).filter(r => r.eventTag).map(r => r.eventTag))];
  const ev = evTags.length ? '\n\n特别说明：已结合客户生命事件「' + evTags.join('、') + '」，建议重点关注相关保障。' : '';

function triggerOCRUpload(clientId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => { if (input.files && input.files[0]) simulateOCR(clientId, input.files[0].name); };
  input.click();
}
function simulateOCR(clientId, fileName) {
  const uploadArea = document.getElementById('ocrUploadArea');
  const progressWrap = document.getElementById('ocrProgressWrap');
  const progressFill = document.getElementById('ocrProgressFill');
  const ocrStatus = document.getElementById('ocrStatus');
  if (uploadArea) uploadArea.classList.add('processing');
  if (progressWrap) progressWrap.classList.add('show');
  if (ocrStatus) ocrStatus.textContent = '正在识别 ' + fileName + '...';
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 25 + 10; if (progress > 100) progress = 100;
    if (progressFill) progressFill.style.width = progress + '%';
    if (progress >= 100) { clearInterval(interval); setTimeout(() => completeOCR(clientId), 300); }
  }, 350);
}
function completeOCR(clientId) {
  const c = CLIENTS.find(x => x.id === clientId); if (!c) return;
  const ocrResults = [
    { type: '重疾险', coverage: 'RM 100,000', insurer: 'Prudential', expiryDate: '2035-12', source: 'OCR识别' },
    { type: '个人意外险', coverage: 'RM 50,000', insurer: 'Great Eastern', expiryDate: '2028-06', source: 'OCR识别' }
  ];
  let added = 0;
  ocrResults.forEach(item => { if (!c.coverageDetails.find(d => d.type === item.type)) { c.coverageDetails.push(item); added++; } });
  c.coverageScores.critical = Math.min(100, c.coverageScores.critical + 40);
  c.coverageScores.accident = Math.min(100, c.coverageScores.accident + 45);
  renderClientDeep();
  showToast('OCR完成：识别到 ' + added + ' 条新保障（' + ocrResults.map(r => r.type).join('、') + '），充足度已重算');
}

      <div class="panel metric-card"><div class="value" style="color:var(--green);">RM 6,200</div><div class="label">本月续保保费</div></div>
      <div class="panel metric-card"><div class="value">7件</div><div class="label">本月成交件数</div></div>
      <div class="panel metric-card"><div class="value" style="color:var(--amber);">73%</div><div class="label">月度目标完成率</div></div>
    </div>
    ${renewRate < renewTarget ? `<div class="renew-alert"><strong>⚠️ 续保率预警</strong><div style="margin-top:6px;">当月续保率 ${renewRate}%，低于目标 ${renewTarget}%。以下客户流失风险较高：</div>
      <div style="margin-top:8px;">${riskClients.map(c => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><strong>${c.name}</strong><span style="font-size:.75rem;color:var(--gray-500);">上次联系${c.healthScore.lastContact}天前 · 到期 ${c.renewalDate}</span><button class="btn" style="font-size:.7rem;padding:2px 8px;" onclick="openPrep('${c.id}')">跟进</button></div>`).join('')}</div></div>` : ''}

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-header">📈 KPI详情 & 行动建议</div>
      <div class="panel-body">
        <div class="kpi-row" onclick="showKPIDetail('新增保费')"><div class="kpi-label">新增保费</div><div class="kpi-track"><div class="kpi-fill" style="width:73%;background:var(--amber);">RM 18,400</div></div><div class="kpi-val">目标 RM 25,000</div></div>
        <div class="kpi-row" onclick="showKPIDetail('成交件数')"><div class="kpi-label">成交件数</div><div class="kpi-track"><div class="kpi-fill" style="width:70%;background:var(--green);">7件</div></div><div class="kpi-val">目标 10件</div></div>
        <div class="kpi-row" onclick="showKPIDetail('客户拜访')"><div class="kpi-label">客户拜访</div><div class="kpi-track"><div class="kpi-fill" style="width:85%;background:var(--blue);">17次</div></div><div class="kpi-val">目标 20次</div></div>
        <div class="kpi-row" onclick="showKPIDetail('续保')"><div class="kpi-label">续保率</div><div class="kpi-track"><div class="kpi-fill" style="width:86%;background:var(--amber);">86%</div></div><div class="kpi-val">目标 90%</div></div>
        <div style="background:var(--amber-bg);padding:14px;border-radius:8px;margin-top:14px;font-size:.85rem;"><strong>⚠️ 行动建议：</strong> 新增保费落后 RM 6,600。优先跟进：① <strong>Tan Wei Ming</strong>（医疗续期+年金）② <strong>Budi Hartono</strong>（重疾，预计RM 2,800）③ <strong>Maria Santos</strong>（医疗续期+重疾）</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">📊 Pipeline 客户池管理 <span style="margin-left:auto;font-size:.75rem;color:var(--gray-500);">共 ${PIPELINE.reduce((s, st) => s + st.leads.length, 0)} 位（含 4 位在管客户 + 总部线索 + 转介绍）</span></div>
      <div class="panel-body"><div class="grid-4" id="pipelineStages">${PIPELINE.map((s, si) => `<div class="pipeline-stage"><h4>${s.stage} (${s.leads.length})</h4>${s.leads.map((l, li) => `<div class="lead-card" onclick="showLeadDetail(${si},${li})"><div class="lead-name">${l.name} ${l.clientId ? '<span class="tag tag-blue" style="font-size:.55rem;">在管</span>' : ''}</div><div class="lead-meta"><span class="tag tag-${l.score === '高' ? 'green' : l.score === '中' ? 'amber' : 'red'}" style="font-size:.62rem;">${l.score}意向</span> ${l.source} · ${fmtRM(l.value)}</div><div style="font-size:.7rem;color:var(--gray-500);margin-top:2px;">${l.reason}</div></div>`).join('')}</div>`).join('')}</div></div>
    </div>
  `;
}
function showLeadDetail(si, li) {
  const lead = PIPELINE[si].leads[li]; if (!lead) return;
  document.getElementById('leadDetailTitle').textContent = `📋 ${lead.name} — 线索详情`;
  const history = (lead.history || []).map(h => { const p = h.split(' '); return `<div style="background:var(--gray-50);padding:10px 12px;border-radius:6px;margin-bottom:6px;font-size:.82rem;"><strong>${p[0]}</strong> ${p.slice(1).join(' ')}</div>`; }).join('') || '<p style="font-size:.82rem;color:var(--gray-500);">暂无记录</p>';
  document.getElementById('leadDetailContent').innerHTML = `
    <div style="margin-bottom:16px;"><h4 style="font-size:.85rem;color:var(--gray-500);margin-bottom:8px;">基本信息</h4>
      <div style="font-size:.85rem;"><div><strong>来源：</strong>${lead.source}</div><div><strong>预计保费：</strong>${fmtRM(lead.value)}</div><div><strong>意向：</strong><span class="tag tag-${lead.score === '高' ? 'green' : lead.score === '中' ? 'amber' : 'red'}">${lead.score}</span></div><div><strong>理由：</strong>${lead.reason}</div></div></div>
    <div style="margin-bottom:16px;"><h4 style="font-size:.85rem;color:var(--gray-500);margin-bottom:8px;">当前阶段</h4><div style="font-size:.85rem;padding:10px 12px;background:var(--blue-bg);border-radius:6px;">${PIPELINE[si].stage}</div></div>
    <div style="margin-bottom:16px;"><h4 style="font-size:.85rem;color:var(--gray-500);margin-bottom:8px;">历史跟进</h4>${history}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${lead.clientId ? `<button class="btn btn-primary" style="font-size:.8rem;" onclick="closeModal('leadDetailModal');openPrep('${lead.clientId}')">📇 打开备课卡</button>` : ''}
      <button class="btn ${lead.clientId ? '' : 'btn-primary'}" style="font-size:.8rem;" onclick="closeModal('leadDetailModal');scheduleFollowupFromLead(${si},${li})">📅 安排跟进</button>
    </div>`;
  document.getElementById('leadDetailModal').classList.add('show');
}
// 用 si/li 取线索再安排，避免把名字/理由拼进 onclick 属性导致引号截断
function scheduleFollowupFromLead(si, li) {
  const lead = PIPELINE[si] && PIPELINE[si].leads[li];
  if (!lead) return;
  scheduleFollowup(lead.name, lead.clientId || null, lead.reason || '跟进');
}
// 安排跟进：弹日期选择，到了那天自动出现在「今日预约拜访」
function scheduleFollowup(name, clientId, purpose) {
  const dToday = TODAY_ISO, dTom = isoOffset(1), d3 = isoOffset(3);
  const modal = document.createElement('div');
  modal.className = 'modal-overlay show'; modal.style.zIndex = '1200';
  modal.innerHTML = `<div class="modal" style="max-width:420px;">
    <h3>📅 安排跟进 — ${name}</h3>
    <p style="font-size:.85rem;color:var(--gray-500);margin-bottom:10px;">选择跟进日期（演示"今天"= ${TODAY_ISO}）。到了那天，TA 会自动出现在「今日」首页的预约拜访里。</p>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" type="button" style="font-size:.8rem;" onclick="document.getElementById('schedDate').value='${dToday}'">今天</button>
      <button class="btn" type="button" style="font-size:.8rem;" onclick="document.getElementById('schedDate').value='${dTom}'">明天</button>
      <button class="btn" type="button" style="font-size:.8rem;" onclick="document.getElementById('schedDate').value='${d3}'">3天后</button>
    </div>
    <label style="font-size:.85rem;font-weight:600;">或自定义日期</label>
    <input type="date" id="schedDate" value="${dToday}" min="${TODAY_ISO}" style="width:100%;padding:9px;border:1px solid var(--gray-200);border-radius:6px;margin:4px 0 10px;">
    <label style="font-size:.85rem;font-weight:600;">跟进事项</label>
    <input type="text" id="schedPurpose" value="${(purpose || '跟进').replace(/"/g, '&quot;')}" style="width:100%;padding:9px;border:1px solid var(--gray-200);border-radius:6px;margin:4px 0 14px;">
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" id="schedConfirm">✅ 确认安排</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  modal.querySelector('#schedConfirm').onclick = () => {
    const date = modal.querySelector('#schedDate').value;
    const purp = modal.querySelector('#schedPurpose').value || '跟进';
    if (!date) { showToast('请选择日期'); return; }
    if (clientId) {
      const c = CLIENTS.find(x => x.id === clientId);
      if (c) c.nextMeeting = { date, time: '待定', place: '电话/拜访跟进', purpose: purp };
    } else {
      state.scheduled.push({ name, clientId: null, date, time: '待定', place: '电话/拜访跟进', purpose: purp });
    }
    modal.remove();
    const isToday = date === TODAY_ISO;
    const dObj = new Date(date);
    showToast(isToday ? `已安排${name}今天跟进，已出现在「今日」首页` : `已安排 ${dObj.getMonth() + 1}月${dObj.getDate()}日 跟进 ${name}，到那天会自动出现在首页`);
    if (state.activeTab === 'home') renderHome();
    if (state.activeTab === 'perf') initPerfTab();
  };
}
function showKPIDetail(metric) {
  const details = {
    '新增保费': { actual: 'RM 18,400', target: 'RM 25,000', gap: 'RM 6,600', action: '优先跟进 Budi（RM 2,800）、Tan（年金）、Maria（重疾）', trend: '↑ 本周新增RM 3,200' },
    '成交件数': { actual: '7件', target: '10件', gap: '3件', action: '本周2个客户进入核保，预计下周一出单', trend: '→ 持平' },
    '客户拜访': { actual: '17次', target: '20次', gap: '3次', action: 'Siti 今天10:30、Budi 今天15:00、Tan 明天10:00', trend: '↑ 上周15次' },
    '续保': { actual: '86%', target: '90%', gap: '4%', action: '3个客户续保意愿<75%，本周完成续保沟通', trend: '↓ 上月91%' }
  };
  const d = details[metric]; if (!d) return;
  const modal = document.createElement('div');
  modal.className = 'modal-overlay show'; modal.style.zIndex = '1000';
  modal.innerHTML = `<div class="modal" style="max-width:480px;"><h3>📈 ${metric} 详情</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;">
      <div style="background:var(--gray-50);padding:12px;border-radius:8px;text-align:center;"><div style="font-size:1.3rem;font-weight:700;color:var(--blue);">${d.actual}</div><div style="font-size:.8rem;color:var(--gray-500);">当前</div></div>
      <div style="background:var(--gray-50);padding:12px;border-radius:8px;text-align:center;"><div style="font-size:1.3rem;font-weight:700;">${d.target}</div><div style="font-size:.8rem;color:var(--gray-500);">目标</div></div></div>
    <div style="font-size:.85rem;margin-bottom:8px;"><strong>差距：</strong>${d.gap}</div>
    <div style="font-size:.85rem;margin-bottom:8px;"><strong>趋势：</strong><span style="color:var(--green);">${d.trend}</span></div>
    <div style="background:var(--blue-bg);padding:12px;border-radius:8px;font-size:.85rem;"><strong>💡 行动建议：</strong>${d.action}</div>
    <div style="text-align:right;margin-top:16px;"><button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">关闭</button></div></div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

// ─── UTILS ──────────────────────────────────────────────────
function scrollToSection(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

// ─── INIT ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderHome();
  renderClientList();
  const st = document.getElementById('aiServerStatus');
  st.innerHTML = 'AI: 智谱 GLM-4-Flash（前端直连）✅'; st.style.color = '#86efac';
});
</script>
</body>
</html>
